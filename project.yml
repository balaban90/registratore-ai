name: RegistratoreAI
options:
  bundleIdPrefix: it.registratoreai
  deploymentTarget:
    iOS: "26.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.9.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.16.0"
    CURRENT_PROJECT_VERSION: "22"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  RegistratoreAI:
    type: application
    platform: iOS
    sources:
      - path: RegistratoreAI
      - path: Shared
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - target: RegistratoreAIWidgets
    info:
      path: RegistratoreAI/Info.plist
      properties:
        CFBundleDisplayName: Registratore AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).processing.*
        CFBundleURLTypes:
          - CFBundleURLName: it.registratoreai.app
            CFBundleURLSchemes:
              - registratoreai
        NSMicrophoneUsageDescription: Serve il microfono per registrare riunioni, lezioni, colloqui e appunti vocali.
        NSSpeechRecognitionUsageDescription: La trascrizione avviene sul tuo iPhone, senza inviare l'audio in rete.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.registratoreai.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RegistratoreAIWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RegistratoreAIWidgets
      - path: Shared
    info:
      path: RegistratoreAIWidgets/Info.plist
      properties:
        CFBundleDisplayName: Registratore AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.registratoreai.app.widgets
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
  RegistratoreAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RegistratoreAITests
    dependencies:
      - target: RegistratoreAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.registratoreai.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  RegistratoreAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RegistratoreAIUITests
    dependencies:
      - target: RegistratoreAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.registratoreai.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: RegistratoreAI
schemes:
  RegistratoreAI:
    build:
      targets:
        RegistratoreAI: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - RegistratoreAITests
        - RegistratoreAIUITests
