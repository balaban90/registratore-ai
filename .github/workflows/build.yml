name: Compila app iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Scegli Xcode 26 più recente
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project RegistratoreAI.xcodeproj \
            -scheme RegistratoreAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/dd" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          # Errori come annotazioni (leggibili anche senza accesso ai log)
          grep -E "error:" xcodebuild.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          test -f build/dd/Build/Products/Release-iphoneos/RegistratoreAI.app/RegistratoreAI

      - name: Crea il file .ipa
        run: |
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/RegistratoreAI.app Payload/
          zip -qry RegistratoreAI.ipa Payload
          ls -lh RegistratoreAI.ipa

      - name: Carica l'IPA da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: RegistratoreAI-ipa
          path: RegistratoreAI.ipa
          retention-days: 30

      - name: Carica il log in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione
          path: xcodebuild.log
