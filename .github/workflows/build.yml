name: Compila app iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Scegli Xcode 26 più recente
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project RegistratoreAI.xcodeproj \
            -scheme RegistratoreAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/dd" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          # Errori come annotazioni (leggibili anche senza accesso ai log)
          { grep -E "error:|failed" xcodebuild.log || true; } | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if ! grep -q "BUILD SUCCEEDED" xcodebuild.log; then
            tail -25 xcodebuild.log | while IFS= read -r line; do echo "::warning::${line}"; done
          fi
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          test -f build/dd/Build/Products/Release-iphoneos/RegistratoreAI.app/RegistratoreAI

      - name: Crea il file .ipa
        run: |
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/RegistratoreAI.app Payload/
          zip -qry RegistratoreAI.ipa Payload
          ls -lh RegistratoreAI.ipa

      - name: Carica l'IPA da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: RegistratoreAI-ipa
          path: RegistratoreAI.ipa
          retention-days: 30

      - name: Carica il log in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione
          path: xcodebuild.log

  test:
    name: Prove automatiche
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Scegli Xcode 26 più recente
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Scegli il simulatore iPhone
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = [int(x) for x in runtime.split("iOS-")[-1].split("-") if x.isdigit()]
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      key = (version, "Pro" in d["name"], d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"], runtime)
          print(best[1]); print(best[2] + " · " + best[3], file=sys.stderr)
          ')
          echo "SIM_ID=$ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$ID" || true

      - name: Esegui le prove
        run: |
          set -o pipefail
          xcodebuild test \
            -project RegistratoreAI.xcodeproj \
            -scheme RegistratoreAI \
            -destination "id=$SIM_ID" \
            -derivedDataPath "$PWD/build/dd" \
            -resultBundlePath "$PWD/Prove.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            > prove.log 2>&1 || true
          # Riepilogo leggibile: tempi misurati e prove fallite
          echo "== Prove eseguite =="
          grep -E "^Test Case '.*' (passed|failed)|Executed [0-9]+ test" prove.log || true
          echo "== Tempi misurati =="
          grep -E "^(TEMPO|CONFRONTO)|Riproduzione: dalla|Sintesi di [0-9]+ caratteri|Lavorazione ancora" prove.log || true
          grep -E "^CONFRONTO|Riproduzione: dalla" prove.log | while IFS= read -r line; do echo "::notice::${line}"; done || true
          { grep -E "error: |: error:|failed \(" prove.log || true; } | grep -v "^ld: warning" | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" prove.log; then
            tail -40 prove.log | while IFS= read -r line; do echo "::warning::${line}"; done
            exit 1
          fi

      - name: Carica i risultati delle prove
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-prove
          path: |
            prove.log
            Prove.xcresult
          retention-days: 14

  release:
    name: Pubblica la versione
    needs: [build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Scarica l'IPA compilato
        uses: actions/download-artifact@v4
        with:
          name: RegistratoreAI-ipa

      - name: Pubblica la versione (aggiornamento dall'app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E 'MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          BUILD=$(grep -E 'CURRENT_PROJECT_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          TAG="v${VER}-${BUILD}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Versione $TAG già pubblicata: per pubblicarne una nuova aumenta CURRENT_PROJECT_VERSION"
            exit 0
          fi
          NOTES=NOTE-VERSIONE.md
          [ -f "$NOTES" ] || echo "Nuova versione." > "$NOTES"
          gh release create "$TAG" RegistratoreAI.ipa --title "Registratore AI $VER (build $BUILD)" --notes-file "$NOTES" --latest

